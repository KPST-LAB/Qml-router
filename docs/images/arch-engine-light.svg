<svg xmlns="http://www.w3.org/2000/svg" width="640" height="672" viewBox="0 0 640 672" role="img" aria-label="Qml Engine: API / Access; Runtime; Executor; CUDA Kernels; GPU Memory; Persistent State; Security; Store">
